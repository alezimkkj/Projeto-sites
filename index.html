<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Still Grounds</title>
    <link rel="stylesheet" href="assets/css/header-hero.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- HEADER + HERO — dono: gerente -->
    <header id="header">
        <div class="container header-container">
            <a href="#hero" class="logo">Still Grounds</a>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#cardapio">Cardápio</a></li>
                    <li><a href="#depoimentos">Depoimentos</a></li>
                    <li><a href="#localizacao">Localização</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="hero">
        <div class="hero-content">
            <p class="hero-phrase">Um bom café não se apressa — assim como uma boa leitura.</p>
            <div class="hero-buttons">
                <a href="#cardapio" class="btn btn-primary">Ver cardápio</a>
                <a href="#localizacao" class="btn btn-secondary">Como chegar</a>
            </div>
        </div>
    </section>

    <!-- SOBRE NÓS + CARDÁPIO — dono: colega 1 -->
    <section id="sobre"></section>
    <section id="cardapio"></section>
    <!-- DIFERENCIAIS + DEPOIMENTOS — dono: colega 2 -->
    <section id="diferenciais"></section>
    <section id="depoimentos"></section>
    <!-- GALERIA + LOCALIZAÇÃO — dono: colega 3 -->
    <section id="galeria"></section>
    <section id="localizacao"></section>
    <!-- NEWSLETTER + FOOTER — dono: todos -->
    <section id="newsletter"></section>
    <footer id="footer">
    </footer>
    <script src="assets/js/script.js"></script>
</body>
</html>
